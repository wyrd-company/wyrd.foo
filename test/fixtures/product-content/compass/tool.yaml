# relationships: implements site
release-unit: compass
name: Compass
version: 1.0.0
docs-version: 1.0.0
owner: example-org/sample-plugins
status: preview
category: Agent Tooling
tagline: Sample instructions for an agent.
blurb: A generic plugin fixture with two harness install paths.
highlights: [Provides sample instructions.]
media:
  - src: assets/demo.svg
    caption: Sample plugin illustration.
kinds:
  - kind: coding-harness-plugin
    install:
      - harness: Example harness
        command: |-
          /plugin marketplace add example-org/plugins
          /plugin install sample@examples
      - harness: Another harness
        command: Follow the setup guide
        default: true
    provides:
      - element: hook
        name: SessionStart
        description: Loads the sample instructions when a session starts.
      - element: skill
        name: sample-review
        description: Reviews a change against the sample conventions.
        harnesses: [Example harness]
release:
  version: 1.0.0
  date: 2026-01-01
  url: https://example.com/releases/1.0.0
