name: PR build

# Fails a pull request, not a deploy, when the docs contract, the content in
# content/, the site build, the built output or the browser tests are broken,
# or when the Intentional configuration or intents are not valid.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-intents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history and tags, so that Intentional finds the release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release intents
        uses: wyrd-company/intentional@3c84bb6f4464287b60783e02bb35ea16b14ebbad # 0.4.0
        with:
          command: check
          intentional-version: "0.4.0"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the docs contract
        run: |
          pnpm typecheck
          pnpm test

      - name: Build the site
        run: pnpm build

      - name: Check the built output
        run: pnpm test:dist

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run the browser tests
        run: pnpm test:browser
