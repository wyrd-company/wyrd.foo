name: Deploy to Cloudflare Pages
description: Build the Astro site with pnpm and upload dist/ to a Cloudflare Pages project via wrangler.

inputs:
  cloudflare-api-token:
    description: Cloudflare API token with Pages:Edit scope on the target account.
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID that owns the Pages project.
    required: true
  cloudflare-project-id:
    description: Cloudflare Pages project name (the slug, e.g. example-dot-com).
    required: true
  preview:
    description: If 'true', upload as a preview deployment instead of production.
    required: false
    default: "false"

outputs:
  deployment-url:
    description: Deployment URL returned by wrangler.
    value: ${{ steps.wrangler.outputs.deployment-url }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '>=22.23.4 <23'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build Astro site
      shell: bash
      run: pnpm build

    - name: Deploy to Cloudflare Pages
      id: wrangler
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        command: >-
          pages deploy ./dist
          --project-name=${{ inputs.cloudflare-project-id }}
          ${{ inputs.preview == 'true' && '--branch=preview' || '' }}
