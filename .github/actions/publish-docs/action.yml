name: Publish tool docs to wyrd.foo (v2)
description: >-
  Runs the wyrd.foo publisher core over a tool repo checkout at a ref, with
  every publishing requirement enforced, writes content/<key>/ for each of
  the repo's products into wyrd.foo and pushes it, retrying when another
  publish pushed first. Tool repos call the reusable workflow
  .github/workflows/publish-docs.yml, not this action.

inputs:
  source:
    description: Path of the tool repo checkout, with its tags (fetch-depth 0).
    required: true
  ref:
    description: The tag or commit of the tool repo to publish.
    required: true
  owner:
    description: The tool repo, "owner/repo".
    required: false
    default: ${{ github.repository }}
  site-url:
    description: Clone URL of the site repo.
    required: false
    default: https://github.com/wyrd-company/wyrd.foo.git
  site-branch:
    description: The site repo branch to publish to.
    required: false
    default: main
  site-token:
    description: A token with contents write access to the site repo (the publisher App token).
    required: true
  release-token:
    description: A token that can read the tool repo's GitHub Releases.
    required: false
    default: ${{ github.token }}
  api-url:
    description: Base URL of the GitHub REST API.
    required: false
    default: ${{ github.api_url }}
  author-name:
    description: Commit author and committer name (the publisher App bot).
    required: true
  author-email:
    description: Commit author and committer email (the publisher App bot).
    required: true
  feature:
    description: '"true" to feature a product on the front page from now. Refused unless the run is a workflow_dispatch.'
    required: false
    default: "false"
  feature-product:
    description: The product key to feature. Optional when the repo has one product that can be featured.
    required: false
    default: ""
  feature-days:
    description: How long the feature lasts, in whole days.
    required: false
    default: "14"
  feature-reason:
    description: Why the product is featured. Empty means "New release".
    required: false
    default: ""
  dry-run:
    description: '"true" to compute and commit into a clone of the site, without pushing.'
    required: false
    default: "false"

outputs:
  outcome:
    description: published, unchanged, dry-run or failed.
    value: ${{ steps.publish.outputs.outcome }}
  commit:
    description: The site commit pushed; empty unless the outcome is published.
    value: ${{ steps.publish.outputs.commit }}

runs:
  using: composite
  steps:
    - id: root
      shell: bash
      run: |
        set -euo pipefail
        root="$(realpath "$GITHUB_ACTION_PATH/../../..")"
        echo "dir=$root" >> "$GITHUB_OUTPUT"
        echo "package-json=$(realpath --relative-to="$GITHUB_WORKSPACE" "$root/package.json")" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ steps.root.outputs.package-json }}

    - shell: bash
      working-directory: ${{ steps.root.outputs.dir }}
      run: pnpm install --frozen-lockfile

    - id: publish
      shell: bash
      env:
        ROOT: ${{ steps.root.outputs.dir }}
        PUBLISH_SOURCE: ${{ inputs.source }}
        PUBLISH_REF: ${{ inputs.ref }}
        PUBLISH_OWNER: ${{ inputs.owner }}
        PUBLISH_SITE_URL: ${{ inputs.site-url }}
        PUBLISH_SITE_BRANCH: ${{ inputs.site-branch }}
        PUBLISH_SITE_TOKEN: ${{ inputs.site-token }}
        PUBLISH_RELEASE_TOKEN: ${{ inputs.release-token }}
        PUBLISH_API_URL: ${{ inputs.api-url }}
        PUBLISH_AUTHOR_NAME: ${{ inputs.author-name }}
        PUBLISH_AUTHOR_EMAIL: ${{ inputs.author-email }}
        PUBLISH_FEATURE: ${{ inputs.feature }}
        PUBLISH_FEATURE_PRODUCT: ${{ inputs.feature-product }}
        PUBLISH_FEATURE_DAYS: ${{ inputs.feature-days }}
        PUBLISH_FEATURE_REASON: ${{ inputs.feature-reason }}
        PUBLISH_DRY_RUN: ${{ inputs.dry-run }}
      run: node "$ROOT/publisher/action.ts"
