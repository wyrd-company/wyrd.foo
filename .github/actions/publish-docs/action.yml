name: Publish tool docs to wyrd.foo (v1, retired)
description: >-
  Retired. wyrd.foo v2 builds only v2 content. Call the reusable workflow
  wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2 instead.

inputs:
  app-id:
    description: Unused. publish-docs@v1 is retired.
    required: false
  private-key:
    description: Unused. publish-docs@v1 is retired.
    required: false
  site-repo:
    description: Unused. publish-docs@v1 is retired.
    required: false
  branch:
    description: Unused. publish-docs@v1 is retired.
    required: false
  docs-dir:
    description: Unused. publish-docs@v1 is retired.
    required: false
  content-dir:
    description: Unused. publish-docs@v1 is retired.
    required: false

outputs:
  published:
    description: Always 'false'. publish-docs@v1 is retired.
    value: "false"
  slug:
    description: Always empty. publish-docs@v1 is retired.
    value: ""

runs:
  using: composite
  steps:
    - name: publish-docs@v1 is retired
      shell: bash
      run: |
        echo "::error title=publish-docs@v1 is retired::wyrd.foo v2 builds only v2 content, so this action publishes nothing. Move your docs to docs/user/ in the v2 format and call the reusable workflow wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2. See https://github.com/wyrd-company/wyrd.foo/blob/main/docs/technical-designs/publishing.yml (calling-workflow)."
        exit 1
