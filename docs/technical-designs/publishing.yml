$schema: https://refinery.systems/ontology/technical-design
title: Publishing tool docs to wyrd.foo
objective: >-
  A tool repo publishes its products and docs to wyrd.foo from its own
  release tags: one data contract in docs/user/, one Zod schema that the site
  and the publisher share, and one publisher core that runs in the
  publish-docs@v2 action and in local mode for the dev server.
relationships:
  references:
    - site
proposed-design:
  high-level-overview: |
    A new tool joins the catalog without a change to wyrd.foo. The tool repo
    holds its public docs in `docs/user/` and pushes them: its publishing
    workflow calls a reusable workflow in wyrd.foo, which runs the
    `publish-docs@v2` action. The action runs the publisher core inside the
    tool repo's workflow, validates, records release data, and commits the
    result to wyrd.foo `main`. One repo holds any number of products, and one
    product holds any number of kinds: CLIs, MCP servers, apps, dev container
    features, dev container images and coding harness plugins.

    ```text
    tool repo                                     wyrd.foo
    ─────────                                     ────────
    the release workflow succeeds, a docs
    tag is pushed, or a manual run
      └─ calling workflow
           └─ reusable workflow (wyrd.foo) @v2
                └─ publish-docs@v2 (publisher core)
                     1. read docs/user/ and .intentional/config.yml at the ref
                     2. validate against the site schema
                     3. resolve release data for every product
                     4. check key ownership
                     5. write content/<key>/ for every product ──push──▶ main
                                                                         └─ deploy (cd.yml)
    ```

    The publisher core is one TypeScript module (`publisher/`). The action
    runs it in publish mode; the dev server runs it in local mode (see
    `local-mode`). The site reads what it writes with the same schema module
    (`src/schema/`). The pages that show the result are in the `site` design.
  publishing-requirements: |
    A repo that publishes to wyrd.foo meets all of these:

    - The repo uses intentional, at version 0.2.1 or later. Its
      `.intentional/config.yml` declares `contract: contract-1` or
      `contract: contract-2`, and each release unit has exactly one tag with
      `role: primary`.
    - Each product names one release unit in `release-unit:`. The default is
      the product key.
    - Each release of a code unit has a GitHub Release on the unit's primary
      tag. A draft Release does not count. Feature entries are the exception:
      see `feature-entries`.
    - Each product, except a feature entry, has a docs unit, `<key>-docs`.
      Docs units are tag-only: they have no GitHub Release, so the repo's
      Releases list shows only what users install.

    In publish mode an unmet requirement is an error. In local mode it is a
    warning.
  docs-folder: |
    Public docs live in `docs/user/`: `docs/user/docs.yml` and
    `docs/user/**/*.md`. Everything under `docs/user/` is published. Nothing
    outside it is published, except the `README.md` of each feature entry,
    which the publisher reads through the entry's `source:`. Other `docs/`
    folders are private.

    ```text
    docs/
    ├── user/
    │   ├── docs.yml           # the repo's products
    │   ├── CHANGELOG.md       # the docs unit changelog (data, not a page)
    │   ├── getting-started.md # a page (front matter names its product)
    │   ├── guides/
    │   │   └── authoring.md   # pages may be at any depth
    │   └── assets/
    │       ├── demo.gif
    │       └── logo.svg
    └── design/                # private
    ```

    Each product has a docs folder. It is `docs/user/<key>/` when that folder
    holds a file (a repo with one docs unit per product, such as
    t3code-client), and otherwise `docs/user/`. The product's asset fields
    (`logo`, `logo-dark`, `favicon`, `social-image` and `media[].src`) are
    relative to its docs folder, so a product whose folder is
    `docs/user/t3c/` writes `logo: assets/logo.svg` for
    `docs/user/t3c/assets/logo.svg`. The `assets` list is relative to
    `docs/user/` for every product.

    A product's pages are published inside its docs folder, so a relative
    link from a page to a file outside that folder points at a file the site
    does not have. The publisher warns about each such link, with its line.
  docs-file: |
    `docs/user/docs.yml` is one file per repo. Top-level fields:

    | Field | Required | Meaning |
    | --- | --- | --- |
    | `schemaVersion` | yes | The site schema version the file targets: `1`. |
    | `assets` | no | Exact file paths, relative to `docs/user/`, that are published. |
    | `products` | yes | A map keyed by product key, with at least one product. |
    | `relationships` | no | Artifact metadata. The schema allows it; the publisher ignores it. |

    `products` is a map, so that intentional's yaml projection writes each
    product's version by key path (`/products/<key>/version`), and so that
    keys are unique within the repo. A product key is lower-case letters,
    digits and hyphens, starting with a letter or digit. It is the folder
    `content/<key>/`, the route `/tools/<key>` and the value of `product:` on
    each of the product's pages.

    ```yaml
    # yaml-language-server: $schema=https://wyrd.foo/schemas/docs/v1.json
    schemaVersion: 1
    assets:
      - assets/demo.gif
      - assets/logo.svg
    products:
      trowel:
        name: trowel
        version: 0.2.0               # code unit `trowel`, written by intentional
        docs-version: 0.2.3          # docs unit `trowel-docs`, written by intentional
        release-unit: trowel         # default = key
        logo: assets/logo.svg
        tagline: Relay webhooks into NATS JetStream, and JetStream messages back out.
        blurb: >-
          A small Go service that verifies and transforms incoming webhooks …
        status: preview
        category: Agent Infrastructure
        order: 8
        highlights:
          - Verifies and transforms incoming webhooks before they reach JetStream.
        media:
          - src: assets/demo.gif
            caption: Relaying a webhook into JetStream.
        kinds:
          - kind: app                # first = primary
            install:
              - method: apt
                os: [linux]
                command: sudo apt install trowel
              - method: docker
                command: docker run --rm -it ghcr.io/wyrd-company/trowel
          - kind: devcontainer-feature
            ref: ghcr.io/wyrd-company/trowel/trowel:0
    ```
  product-fields: |
    | Field | Required | Meaning |
    | --- | --- | --- |
    | `name` | yes | Display name, one line. |
    | `version` | yes | The installed version, from the product's code unit. SemVer 2.0.0. Written by intentional. |
    | `docs-version` | yes | The docs version, from the docs unit `<key>-docs`. SemVer 2.0.0. Written by intentional. |
    | `release-unit` | no | The product's code release unit. Default: the product key. |
    | `tagline`, `blurb` | yes | One line, and the description in the hero. |
    | `status` | yes | `stable`, `preview` or `planned`. |
    | `category` | yes | One of the categories (see `categories`). |
    | `order` | no | Integer catalog position, lower first. Products without `order` sort after the products with it, by `name`. |
    | `kinds` | yes | One or more kind blocks; the first is the primary kind. |
    | `highlights` | yes | One to six one-line statements for "What it does". |
    | `media` | yes | One or more items: `src` (relative to the product's docs folder and listed in `assets`), a one-line `caption`, and an optional one-line `alt`. |
    | `nav` | no | Docs sections, groups and page order. |
    | `logo`, `logo-dark` | no | Square SVG marks, relative to the product's docs folder and listed in `assets`. |
    | `favicon` | no | SVG or PNG, relative to the product's docs folder and listed in `assets`. |
    | `social-image` | no | PNG or JPEG, 1200×630, relative to the product's docs folder and listed in `assets`. |

    `owner`, `docs-path`, `release`, `licence` and `featured` are written by the
    publisher; `docs.yml` does not set them. `docs.yml` has no `repo` field:
    the site builds the GitHub link from `owner`. Every other field is
    rejected.
  plugin-install: |
    A `coding-harness-plugin` kind has a nonempty `install` list. Each entry
    has a one-line `harness` label and nonempty `command` instructions. One
    entry may set `default: true`; otherwise the first is selected. Commands
    are authored by the plugin repo and can contain multiple lines, including
    marketplace setup. The site neither derives commands nor reads harness
    plugin manifests. The product uses the existing release and docs units.

    ```yaml
    kinds:
      - kind: coding-harness-plugin
        install:
          - harness: Example harness
            default: true
            command: |-
              /plugin marketplace add example-org/example-marketplace
              /plugin install sample@examples
          - harness: Another harness
            command: Follow the plugin setup guide for this harness.
    ```
  licence: |
    The publisher reads the repo-root `LICENSE` at the input ref once for
    all products and feature entries. `tool.yaml` carries an optional,
    ingest-owned `licence` containing an SPDX expression with listed licence
    and exception identifiers. `docs.yml` does not declare it.

    One explicit `SPDX-License-Identifier: <expression>` in LICENSE is
    authoritative, including compound expressions with AND, OR and WITH.
    Without that declaration, complete MIT and Apache-2.0 texts are matched
    against spdx-license-list, ignoring whitespace and copyright notice lines.
    Changed terms are not matched. Missing, unidentifiable, invalid or
    ambiguous licences produce a warning and no field, also in strict mode.
    Multiple different declarations are ambiguous. A LICENSES/ folder does
    not establish the repo's expression; the publisher never infers AND or OR
    from its contents. Other licences can use the explicit SPDX declaration.
    Detection is local and uses no network service. Republishing fills the
    field for existing products.
  kinds: |
    `kinds` is an array of kind blocks. `kind` is one of `cli`, `mcp-server`,
    `app`, `coding-harness-plugin`, `devcontainer-feature` and `devcontainer-image`. `app` means a
    thing you run. Each kind block holds the data for that kind's install
    block on the product page:

    | Kind | Block |
    | --- | --- |
    | `cli`, `app` | `install`: the install methods (see `install`). |
    | `coding-harness-plugin` | `install`: harness labels and complete install instructions (see `plugin-install`). |
    | `mcp-server` | `install`: the client methods (see `mcp-install`). `tools`: the tools table, one or more `{ name, description, effect }` entries; `effect` is a short text such as "Read-only" or "Writes". |
    | `devcontainer-feature` | `ref`: the feature's OCI reference. |
    | `devcontainer-image` | `ref`: the image reference. `tags`: optional, the tags table as `{ tag, base, architectures }` entries, for an image whose tags the publisher cannot read from the image build config. |

    For an image, the site generates the dev container snippet from `ref`.
    Optional `compose` and `kubernetes` fields name tool-authored YAML files;
    see `container-manifests`.
    Product docs describe required runtime settings, such as ports and volumes.

    A product lists each kind once. The first kind is the primary kind: its
    badge and its "get it" command show in the catalog row, and its default
    install command shows in the hero.
  install: |
    Each install method is described once. The site builds the product
    page's install block and the hero's default command from it.

    ```yaml
    install:
      - method: homebrew
        os: [macos, linux]
        command: brew install wyrd-company/tools/toha
      - method: apt
        os: [linux]
        label: Debian, Ubuntu
        command: sudo apt install toha
      - method: cargo
        os: [macos, linux, windows]
        command: cargo install toha
      - method: docker
        command: docker run --rm -it ghcr.io/wyrd-company/toha
    ```

    | Field | Required | Meaning |
    | --- | --- | --- |
    | `method` | yes | One of `homebrew`, `apt`, `rpm`, `aur`, `nix`, `cargo`, `npm`, `npx`, `pipx`, `go`, `winget`, `scoop`, `docker`, `archive`, `script`, `other`. The site owns each method's display name and icon. |
    | `os` | yes, except `docker` | Any of `macos`, `linux`, `windows`, each once. |
    | `command` | yes | One line, or several (YAML block scalar). Shown as one code block with one Copy button. |
    | `label` | yes for `other`, else no | Short qualifier, for example "Debian, Ubuntu" or "From Git". One line. |
    | `default` | no | `true` on at most one entry: the command shown in the hero. Otherwise the first entry. |

    - `npx` is a command that runs the tool without installing it.
    - A method that installs from another place keeps its method and adds a
      `label` (`cargo` with `label: From Git`). `docker` covers `docker run`
      and `docker pull`.
    - `other` is for an install with no method in the list; its `label`
      names it.
    - An install command names the package as its registry publishes it,
      which can differ from the product key.

    For `method: apt` and `method: rpm`, `command` is only the install line:
    one command, with no line break, `;`, `|` or `&&`. The site owns the
    repository setup (signing key and source list from repo.wyrd.foo) and
    shows it above the install line, so the setup has one source.

    The site derives the platform tabs from `os` (macOS, Linux, Windows, plus
    Docker when a `docker` entry exists). A method listed for several systems
    appears under each. A method may appear more than once with different
    `os` values when the command differs per system.
  mcp-install: |
    The `install` list of an `mcp-server` kind has the same `label`,
    `default` and `command` fields, and no `os`. Its `method` is an MCP
    client or a plugin marketplace:

    | Method | Tab |
    | --- | --- |
    | `claude-code`, `claude-desktop`, `cursor`, `vscode` | The client's own tab. `command` is its add command or configuration. |
    | `json` | The generic JSON configuration. |
    | `plugin` | A plugin marketplace. `label` names the marketplace and is required. |
    | `other` | A client with no method in the list. `label` names it and is required. |

    The site makes one tab for each entry present.

    ```yaml
    kinds:
      - kind: mcp-server
        install:
          - method: claude-code
            command: claude mcp add <name> -- <server command>
          - method: plugin
            label: Claude plugin marketplace
            command: /plugin install t3code-mcp
        tools:
          - { name: <tool>, description: <what it does>, effect: Read-only }
    ```
  categories: |
    `category` is one of a closed list:

    1. Git & Review
    2. Release & Versioning
    3. Templates & Scaffolding
    4. Dev Containers
    5. Agent Tooling
    6. Agent Infrastructure
    7. Code Intelligence
    8. Knowledge & Planning

    A feature entry without `category` is in Dev Containers. The catalog
    shows each row's category and its filter matches it; the catalog order
    comes from `order` and `name` (see the `site` design, `home-page`).
  nav: |
    ```yaml
    nav:
      - section: Authoring
        groups:
          - group: The interview
            pages: [template-interviews, template-flow, template-jinja]
    ```

    `nav` belongs to one product and lists that product's page slugs; every
    slug it lists is a page of that product. Each section has at least one
    group and each group at least one page. Published pages that `nav` does
    not list go into a trailing "More" group.
  feature-entries: |
    A dev container feature that keeps its own `README.md` and versioned
    `devcontainer-feature.json` in the repo has a short entry:

    ```yaml
    products:
      caddy:
        kinds: [{ kind: devcontainer-feature }]
        source: src/features/caddy      # devcontainer-feature.json + README.md
        category: Dev Containers        # optional; the default
        logo: logo.svg                  # optional; relative to source
      heddle:
        kinds: [{ kind: devcontainer-feature }]
        source: src/features/heddle
        release-unit: heddle-feature    # optional; default = key
    ```

    - The entry holds only the key, `kinds` (one `devcontainer-feature`
      block), `source`, and an optional `category`, `logo` and
      `release-unit`. Each feature is listed by its own entry; `docs.yml` has
      no glob.
    - `source` is the path of the feature's folder in the repo. The feature's
      `logo` is relative to it (`src/features/caddy/logo.svg` for the entry
      above), so the logo ships with the feature. A feature's `logo` is not
      listed in `assets`.
    - The feature's release unit is `release-unit`, or the key.
    - The publisher derives the feature's OCI reference as
      `ghcr.io/<owner>/<repo>/<feature id>:<major>`, from the repo (lower
      case), the `id` and the major version in `devcontainer-feature.json`.
      An optional `ref` in the kind block overrides it; the publisher warns
      when its tag is not that major. A digest reference is not compared.
    - Name, description, version and options come from
      `devcontainer-feature.json` at `source`.
    - The page is the abbreviated feature page: the `devcontainer.json`
      snippet, then `README.md` as it is. The README is inside the feature's
      release unit (`src/features/<id>`), so a docs fix is a patch release of
      that feature. Feature entries have no docs unit and no docs pages.
    - A feature entry needs no highlights and no media.
    - A feature entry needs no GitHub Release. Its release data comes from
      the intentional tag of its unit and the unit's changelog.
    - A feature entry is not listed in Recent releases and is never featured.
    - The publisher warns when the option names in `README.md` differ from
      the options in `devcontainer-feature.json`. It reads the first column
      of the table under `## Options` in either README format: the repo's own
      (`Option` header, names in backticks) or the one devcontainers'
      generated docs use (`Options Id` header, bare names).

    A dev container image has a full product entry, a docs unit and GitHub
    Releases, like any other product.
  pages: |
    Pages are Markdown files at any depth under `docs/user/`. The folder is
    the gate: every `.md` under it is a page, except the docs unit changelog
    `CHANGELOG.md` at the `docs/user/` root or in a `docs/user/<key>/` folder
    of a product key. The changelog is data: it has no front matter.

    ```markdown
    ---
    title: Getting started # sidebar and heading label (required)
    product: trowel        # product key in docs.yml (required)
    order: 1               # page order where nav does not decide it
    install: true          # optional: render the install block at the top
    ---

    Markdown body.
    ```

    - `product:` names the product the page belongs to. It is a key in
      `products`, and not a feature entry: feature entries have no docs
      pages.
    - Front matter holds only `title`, `product`, `order`, `install` and the
      optional `relationships`.
    - The slug is the file name without `.md`. It is unique within a
      product, so two products in one repo can each have
      `getting-started.md`.
    - A page's URL is `/docs/<key>/<slug>`.
    - The slugs `changelog` and `index` are reserved, in any letter case.
      `/docs/<key>/changelog` shows the docs unit changelog, and
      `/docs/<key>` is the product's docs landing redirect, which a page at
      `/docs/<key>/index` would serve again. The publisher rejects a page
      with either slug at any depth, naming the file, and the site build
      fails on one.
  release-units: |
    intentional writes both versions into `docs.yml` as committed yaml
    projections. The code unit is the product's release unit; it projects
    `version`. The docs unit, `<key>-docs`, projects `docs-version`.

    ```yaml
    # .intentional/config.yml
    release-units:
      trowel:                          # code unit
        path: .
        projections:
          - adapter: yaml
            file: /docs/user/docs.yml
            pointer: /products/trowel/version
            mode: committed
      trowel-docs:                     # docs unit
        path: docs/user
        depends-on: [ trowel ]
        projections:
          - adapter: yaml
            file: /docs/user/docs.yml
            pointer: /products/trowel/docs-version
            mode: committed
        tags:
          primary: { role: primary, template: "{id}@{version}" }
    ```

    - `version` is the code unit's version: the version a user installs.
    - `docs-version` is the docs unit's version. The docs unit is
      `<key>-docs`, at path `docs/user`, with `depends-on: [<code unit>]` and
      the tag `<key>-docs@{version}`. Projection file paths are root-relative:
      a leading `/` names a path from the repo root, whatever the unit's
      path. A docs-only intent moves only `docs-version`, so docs
      release on their own, with their own intents, changelog and tags.
    - A repo with one docs unit keeps it at `docs/user`, so its changelog is
      `docs/user/CHANGELOG.md`. A repo with more than one docs unit gives
      each unit the path `docs/user/<key>/`, so each changelog is
      `docs/user/<key>/CHANGELOG.md`.
    - The docs footer shows both: "Docs 0.2.3 · for trowel 0.2.0".
  devcontainers-tags: |
    intentional owns each dev container feature's release tag,
    `{id}@{version}` (for example `caddy@1.0.1`), as an annotated tag. The
    lightweight tag that `devcontainers/action` makes for the same release
    (`feature_caddy_1.0.1`) is a side effect and is not read. An image's date
    build tags (for example `20261018.123-noble`) are registry tags for the
    image's tags table, not release versions.
  container-manifests: |
    An app or CLI `method: docker` install entry may declare optional `compose`
    and `kubernetes` paths. Other install methods reject these fields. A
    `devcontainer-image` kind block accepts the same fields. Each path names
    a tool-authored file; the site does not infer runtime configuration from
    `command` or `ref`. The Docker command remains required and keeps its
    default and hero behavior. Only declared manifests add method tabs.

    ```yaml
    kinds:
      - kind: app
        install:
          - method: docker
            default: true
            command: docker run --rm alpine:3
            compose: install/compose.yaml
            kubernetes: install/workload.yaml
    ```

    The same install entry is supported under `kind: cli`.
    For a dev container image:

    ```yaml
    kinds:
      - kind: devcontainer-image
        ref: ghcr.io/example-org/workspace:1
        compose: install/compose.yaml
        kubernetes: install/workload.yaml
    ```

    Both paths are optional. Each is relative to the product's docs folder,
    like `media[].src`. List the resolved paths in top-level `assets`, relative
    to `docs/user/`. For a product in `docs/user/workspace/`, for example, list
    `workspace/install/compose.yaml` and `workspace/install/workload.yaml`.
    No manifest is inferred from a filename or from the image reference.

    The publisher requires each declared file to exist within the product's
    docs folder, be listed in `assets`, and contain non-empty UTF-8 YAML
    mapping documents. Absolute paths, backslashes and `.` or `..` path
    segments are rejected by the path schema. It copies the original bytes
    into `content/<key>/docs/<path>`; it does not serialize the parsed YAML.
    The site renders and copies that content verbatim and serves it through
    the product assets endpoint. Comments, multi-document YAML, image
    references, environment, mounts, commands and ports remain tool-authored.
    Platform semantics and any companion files remain the tool's responsibility;
    the tool's docs explain preparation and relative file dependencies.
    The publisher does not execute manifests or deploy workloads.

    Prefer `compose.yaml`, the Docker Compose convention:
    https://docs.docker.com/compose/intro/compose-application-model/.
    Kubernetes has no required basename; use a descriptive `.yaml` name for
    the authored resource or resources (for example `workload.yaml`):
    https://kubernetes.io/docs/concepts/configuration/overview/.
    Explicit paths follow the media convention so that tool repos can keep
    existing filenames and any directory structure. The fields are additive
    within schemaVersion 1 and publish-docs v2; existing entries need no edit.
    This is a minor contract release.
  generated-data: |
    Data produced at build time is a file in the tool repo's workspace when
    the publisher runs, not a release asset:

    | Kind | Data | File |
    | --- | --- | --- |
    | `devcontainer-feature` | Name, description, version, options | `devcontainer-feature.json` |
    | `devcontainer-image` | Image version | `manifest.json` |
    | `devcontainer-image` | Registry tags | The kind block's `tags`; without them, one tag per `variants` entry of `manifest.json`, each with the manifest's `architectures` |

    The publisher finds an image's `manifest.json` through the json
    projection of the image's code unit in `.intentional/config.yml`, copies
    it to `content/<key>/manifest.json`, and warns when its `version` differs
    from `version` in `docs.yml`. An MCP server's tools table is the `tools`
    list in its kind block.
  calling-workflow: |
    A tool repo calls the reusable workflow in wyrd.foo,
    `.github/workflows/publish-docs.yml`, not the action. The reusable
    workflow wraps the action, so the action's inputs and mechanism change
    without edits to tool repos.

    ```yaml
    name: Publish docs

    on:
      workflow_run:
        workflows: [ Release ]        # the repo's release workflow
        types: [ completed ]
      push:
        tags:
          - "trowel-docs@*"           # docs unit tags
      workflow_dispatch:
        inputs:
          ref:
            description: Tag or commit to publish
            required: true
            type: string
          feature:
            description: Feature a product on the front page
            type: boolean
            default: false
          feature-product:
            description: The product key to feature; empty when the repo has one product
            type: string
            default: ""
          feature-days:
            description: How long the feature lasts, in days
            type: string
            default: "14"
          feature-reason:
            description: For example "New MCP server"; default "New release"
            type: string
            default: ""

    permissions: {}

    jobs:
      publish:
        if: >-
          github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
        permissions:
          contents: read
        uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_branch || github.ref_name }}
          feature: ${{ inputs.feature || false }}
          feature-product: ${{ inputs.feature-product || '' }}
          feature-days: ${{ inputs.feature-days || '14' }}
          feature-reason: ${{ inputs.feature-reason || '' }}
        secrets:
          WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
          WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
    ```

    - The triggers are the repo's release workflow completing, a push of a
      `<key>-docs@*` tag, and a manual run. The release workflow runs only
      for release tags, so a successful run from a push names a release tag
      as its head branch, and the publisher reads that tag's GitHub Release
      after the release workflow creates it. The `if:` guard accepts a
      `workflow_run` only when it succeeded, came from a push and ran in the
      same repo.
    - A plain push to `main` does not publish.
    - A `workflow_run` or tag trigger passes no feature inputs, so it features
      nothing.
    - `workflows:` names the release workflow by its `name:`, written exactly.
      A different name matches no workflow, and a release does not publish.
    - The code tag and the docs tag can be on the same commit. The release
      workflow builds the tag that started it, by name
      (`RELEASE_TAG: ${{ inputs.tag || github.ref_name }}`): it checks out
      `refs/tags/$RELEASE_TAG` and passes the tag to each tool that finds a
      tag from the commit, such as `GORELEASER_CURRENT_TAG` for GoReleaser.
  reusable-workflow: |
    The reusable workflow's inputs:

    | Input | Type | Default | Meaning |
    | --- | --- | --- | --- |
    | `ref` | string | required | The tag or commit of the tool repo to publish. |
    | `feature` | boolean | `false` | Feature a product on the front page from the time of the run. |
    | `feature-product` | string | `""` | The product key to feature. It may be empty when the repo has exactly one product that is not a feature entry. |
    | `feature-days` | string | `"14"` | How long the feature lasts, in whole days, 1 or more. |
    | `feature-reason` | string | `""` | The feature's reason, one line. Empty means "New release". |
    | `dry-run` | boolean | `false` | Run every check, write the result into a clone of wyrd.foo and commit it there, but do not push. |

    It needs the secrets `WYRD_TOOLS_DOCS_PUBLISHER_APP_ID` and
    `WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY` (the calling workflow passes
    each by name). Its outputs are `outcome` (`published`, `unchanged`, `dry-run` or
    `failed`) and `commit`, the wyrd.foo commit it pushed (empty unless the
    outcome is `published`).

    The reusable workflow:

    1. fails a run with `feature: true` on any event but `workflow_dispatch`,
       before it checks anything out or mints a token;
    2. checks out the tool repo at `ref`, with its full history and tags, and
       without persisted credentials;
    3. mints the publisher App token for wyrd.foo, with contents write
       access, and names the App bot as the commit author and committer;
    4. runs the `publish-docs@v2` action (`.github/actions/publish-docs`) as
       `$/.github/actions/publish-docs`, so the action is the one at the
       workflow's own commit.

    Runs from one tool repo do not overlap: the workflow's concurrency group
    is the tool repo, and a new run waits for the running one. Runs from
    different repos race on wyrd.foo `main`, and the publisher retries those
    (see `publisher`). A run times out after 15 minutes, which leaves room
    for the publisher's wait of at most 10 minutes for a GitHub Release.

    The action is a composite action that sets up Node 24 and pnpm, installs
    wyrd.foo's dependencies with the frozen lockfile, and runs
    `publisher/action.ts`: the publisher core in publish mode. It reads the
    tool repo's GitHub Releases with that repo's `GITHUB_TOKEN`. The action
    holds the feature rule too: with `feature: true` it fails unless
    `GITHUB_EVENT_NAME` is `workflow_dispatch`, before it reads the site.
    It prints each finding as a workflow annotation and the run's summary to
    the step summary.

    Tool repos call the workflow at `@v2`, the major tag of wyrd.foo's own
    release unit, `wyrd-foo`. The unit's version is the version of this
    contract: the workflow's inputs, secrets and outputs, the docs contract
    and the content layout. A change that breaks a tool repo is a new major.
    Each `2.x.y` release has the tag `2.x.y`. The intentional tag templates
    cannot hold a `v`, so the push of a release tag runs the major-tag
    workflow (`.github/workflows/major-tag.yml`), which moves `v2` to the
    release when it is the highest `2.y.z`.
  publisher: |
    Every run computes all of the repo's products from the files at the ref,
    so the result is the same for every trigger. The trigger only chooses the
    ref.

    1. **Read** `docs/user/docs.yml`, the pages under `docs/user/`, each
       feature entry's `source` folder and `.intentional/config.yml` at the
       ref. From the intentional config the publisher reads only release-unit
       configuration: each unit's path, its primary tag template and its
       projections. It does not read intentional's generated workflows.
    2. **Validate** `docs.yml` and every page against the site's Zod schema.
       A page with no front matter fails. A `schemaVersion` other than `1`
       fails validation. Then the publisher runs the checks the schema cannot
       express:
       - every page's `product:` is a key in `products`;
       - every slug is unique within its product;
       - no page has a reserved slug (`changelog` or `index`), in any letter
         case;
       - every `nav` page exists for that product;
       - no page names a feature entry;
       - every `media.src`, `logo`, `logo-dark`, `favicon` and
         `social-image` of a full product, resolved against the product's
         docs folder, is listed in `assets`, and every listed asset exists
         inside `docs/user/`;
       - a feature entry's `logo`, resolved against its `source`, exists in
         the repo;
       - every page of a product is inside the product's docs folder;
       - `logo` and `logo-dark` (a feature entry's `logo` too) are SVG;
         `favicon` is SVG or PNG; `social-image` is PNG or JPEG at 1200×630.
         The file extension and the file content must both match;
       - `logo` and `logo-dark` are square: the SVG `viewBox` (else its
         `width` and `height`) has equal sides;
       - for each feature entry, `devcontainer-feature.json` and `README.md`
         exist at `source`, and `devcontainer-feature.json` has an `id`, a
         SemVer `version`, a `name` and a `description`.

       The publisher warns, and does not fail, when a feature's `README.md`
       option names differ from its `devcontainer-feature.json` options, when
       an authored feature `ref` has a tag other than the major of the
       feature's version, when a page links to a file outside its product's
       docs folder, and when a page links to a listed asset outside its
       product's docs folder (that asset is not published with the
       product). The feature's version comes from the feature entry's
       `devcontainer-feature.json`; for a product's `devcontainer-feature`
       kind block whose `ref` is in this repo, from the one
       `<feature id>/devcontainer-feature.json` in the repo whose `id` is the
       last path segment of the `ref`. With no such file, or more than one,
       the tag is not checked.
    3. **Resolve release data** for each product. The publisher takes
       `version` and `docs-version` from `docs.yml` at the ref, reads the
       code unit's primary tag template, and builds the tag from `version`.
       - For a product, the publisher fails if that tag has no published
         GitHub Release. From the release it reads date, URL and notes (the
         Release body); the version is `version`.
       - A docs tag pushed with a code tag starts a publish while the code
         release is still making that tag's Release. So when the Release is
         not found, the publisher waits and asks again: 15 seconds, 30
         seconds, 1 minute, then 2 minutes at a time, at most 10 minutes in
         all for the run, over every product. It prints a line before each
         wait. When the bound is used up, the finding says how long it
         waited. Any other lookup failure (refused, unreachable, malformed)
         fails at once. Local mode and validate do not wait.
       - For a feature entry, the publisher reads the version from
         `devcontainer-feature.json` and builds the tag from it. The date is
         the annotated tag's date (a lightweight tag gives its commit date,
         with a warning), and the notes are the version's `## <version>`
         section of the unit changelog (intentional's tag message is a
         machine record, not notes).
       - For both, it reads the code unit changelog, `CHANGELOG.md` in the
         unit folder, and the docs unit changelog.
    4. **Check key ownership.** Each `content/<key>/tool.yaml` records its
       owner in `owner: <owner/repo>`. The publisher rejects a key that
       another repo owns, and a key whose folder names no owner it can read.
    5. **Write** `content/<key>/` for every product in the map (see
       `content`). It replaces each folder whole, so removed pages and assets
       go too. It carries `featured` forward from the existing `tool.yaml`
       (it drops a `featured` block that is not valid, with a warning) and
       applies the run's `feature` inputs. It deletes every `content/<key>/`
       folder that this repo owns and that is not in its map, so removing or
       renaming a product needs no hand edits.

       An error in any product fails the whole repo: the run writes nothing
       for it, and the content folder keeps what the last good run wrote.
    6. **Push.** The publisher writes into a fresh depth-1 clone of
       wyrd.foo `main`, commits only when the content folder changed, as the
       publisher App bot, with the message
       `docs: publish <repo> (<owner/repo>@<short commit>)`, and pushes. When
       the push is refused and `main` has moved (another publish pushed
       first), it clones the new tip, writes the same result again (so step 4
       runs on the new content) and pushes again, up to 5 attempts. A refused
       push when `main` has not moved is an error and is not retried. The
       push starts `cd.yml`.

    The site repo is cloned, committed and pushed with isomorphic-git over
    HTTPS. The HTTP client refuses redirects, so the token goes only to the
    URL it was given, and bounds each request to 60 seconds.
  local-mode: |
    The dev server (`task dev:v2`) runs the same publisher core in local
    mode. `publisher/local-repos.yml` names the branch (`wyrd-foo-v2`) and
    the tool repos, each read from its clone at `<tools dir>/<name>` (tools
    dir `/workspaces/tools`, or `WYRD_TOOLS_DIR`, or `--tools-dir`). An entry
    may set `path` for another clone folder and `owner` for an `owner/repo`
    other than the one its origin remote names.

    For each repo, local mode fetches the branch from origin into
    `refs/remotes/origin/wyrd-foo-v2` of its local clone, so a merged and
    pushed branch shows up. The fetch runs `git` itself, because the clones
    use SSH. It never prompts, updates no other ref and no `FETCH_HEAD`, and
    is bounded to 60 seconds; on the bound it stops git and every process it
    started. A fetch that fails is a warning. Local mode then reads
    `origin/wyrd-foo-v2`, else the local `wyrd-foo-v2` branch, through git
    objects, and names the ref it read in its output. It does not check out a
    branch or change the clone's working tree, index, local branches or
    tags, and it makes no commit and no push. It writes into a dev content
    folder in the wyrd.foo checkout (`WYRD_CONTENT_DIR`, default
    `.content-v2`), and the dev server serves the site from that folder. It
    prints each repo's warnings and errors and a summary line.

    - When no GitHub Release is reachable, release data comes from the local
      tag: the annotated tag's date, and the version's section of the unit
      changelog as notes. The GitHub API is read with `GITHUB_TOKEN` or
      `GH_TOKEN` when one is set; `--offline` skips the fetch and reads local
      tags only.
    - A requirement that a repo does not meet yet is a warning, not a
      failure: no intentional, no release unit or docs unit, no GitHub
      Release, no release tag, no unit changelog, no image `manifest.json`.
      A repo without intentional sets `version` and `docs-version` by hand on
      its `wyrd-foo-v2` branch.
    - A repo with no local clone, or with no `wyrd-foo-v2` branch, is skipped
      with a warning.
    - Docs unit tags are not read, so a docs unit with no tag yet is not a
      finding.
    - A schema or check error fails that repo only. The run goes on with the
      next repo, and exits 0 unless it cannot start.

    `task validate:repo -- <repo path>` runs the same checks on one tool repo
    checkout and writes nothing, so key ownership is not checked. It reads
    the working tree as it is on disk, or a ref with `--ref`, and exits 1
    when the repo would fail. `--owner` names the `owner/repo` when the
    clone's origin does not. An unmet requirement is a warning, as in local
    mode. With `--strict` it is an error, as in publish mode, so a repo that
    already publishes finds every finding that would fail its publish before
    it pushes a tag. `--strict` reads GitHub Releases, as publish mode does;
    it refuses `--offline` and exits 2.

    Validate also reads the top-level `.yml` and `.yaml` files in
    `.github/workflows/` from the selected tree. A workflow's effective name
    is its `name:` value, or its repository-relative path if omitted.
    `workflow_run.workflows` accepts a scalar string or an array. Inclusion
    filters are checked case-sensitively with minimatch, with braces and
    extglobs disabled and dot names enabled. Compatible forms include `*`,
    alphanumeric bracket classes and escaped special characters. An unmatched
    inclusion is a warning, or an error with `--strict`, naming the caller
    file and filter. Exclusion filters need not match an existing name.
    This check does not evaluate the final set after ordered exclusions.

    GitHub's filter contract defines `?` and `+` as repetition of the
    preceding character, and `**` can cross slashes inside a segment.
    Filters with these unescaped forms are left unchecked to avoid false
    errors from shell-glob semantics. Names containing dot path segments and
    patterns exceeding the library's size limit are also left unchecked.
    Glob filters are left unchecked when a workflow name ends in `/`, where
    the library applies filesystem directory semantics. Literal names use
    exact string matching after escaped characters are decoded.
    No unsupported filter is rejected, including in strict mode. This check
    verifies existence where supported; it does not establish full Actions
    validity. The platform contract is documented at
    https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_runworkflows
    and scalar/array forms at
    https://github.com/actions/languageservices/blob/main/workflow-parser/src/workflow-v1.0.json.
    A workflow file that is not valid YAML is reported at the same severity.
    Repos with no `workflow_run` trigger need no such match.

    A checkout can be a plain clone or a linked worktree, in local mode,
    validate and publish mode alike. The publisher finds the git dirs the way
    git does: a `.git` file names the worktree's own git dir, and that dir's
    `commondir` names the common git dir. It reads `origin`, branches, tags
    and objects from the common git dir, and `HEAD` and the other
    per-worktree refs from the worktree's own git dir.
  content: |
    For a product, `content/<key>/` holds:

    ```text
    content/<key>/
    ├── tool.yaml          # the product entry, plus owner, release and featured
    ├── CHANGELOG.md       # the code unit changelog: the product page's Releases section
    ├── manifest.json      # a devcontainer-image product: the image manifest
    └── docs/              # the product's files from its docs folder, at the same paths
        ├── CHANGELOG.md   # the docs unit changelog, linked from the docs version footer
        ├── getting-started.md
        ├── guides/authoring.md
        └── assets/logo.svg
    ```

    - `docs/` mirrors the product's docs folder (`docs/user/<key>/` or
      `docs/user/`): its pages at their paths in that folder, and the listed
      assets in that folder that its fields name or its pages link to. The
      asset fields are relative to the docs folder, so they resolve under
      `content/<key>/docs/`.
    - The docs unit changelog is `CHANGELOG.md` in the product's docs
      folder, so it is always `docs/CHANGELOG.md`.

    A feature entry's folder holds `tool.yaml`, its `README.md` (the page
    body), its `devcontainer-feature.json`, the code unit `CHANGELOG.md`, and
    its logo under `docs/`, at the path `logo` names: the publisher reads the
    logo from `source` and writes it there.

    `tool.yaml` holds the validated product entry, with `release-unit` filled
    in, plus the fields that only the publisher writes:

    ```yaml
    owner: wyrd-company/trowel
    docs-path: docs/user
    release:
      version: 0.2.0
      date: 2026-10-01
      url: https://github.com/wyrd-company/trowel/releases/tag/0.2.0
      notes: …
    featured:
      from: 2026-10-01
      until: 2026-10-15
      reason: New MCP server
      version: 0.2.0
    ```

    A devcontainer-image kind block in `tool.yaml` carries the `tags` the
    publisher read from `manifest.json` when `docs.yml` sets none.

    A feature entry's `tool.yaml` holds the entry with `release-unit` and the
    kind block's `ref` filled in, `name`, `description` and `version` from
    `devcontainer-feature.json`, `owner`, and `release` from the tag (no
    `url`). It has no `featured` and no `docs-path`.

    `docs-path` is the repo folder that holds the product's pages:
    `docs/user`, or `docs/user/<key>` in a repo with one docs unit per
    product. The default is `docs/user`. The site builds each page's "Edit on
    GitHub" link from `owner`, `docs-path` and the page's path under
    `content/<key>/docs/`.

    The site reads `tool.yaml` and the pages with the same module's schemas.
  featured-data: |
    A run triggered by a release or a docs tag writes no `featured`: the
    site's pick shows a fresh code release without any input (see the `site` design, `featured-product`).
    `featured` comes only from the `feature` inputs of a manual run, for a
    set reason or length. The reusable workflow and the action both reject
    `feature: true` outside a manual run (an event other than
    `workflow_dispatch`).

    The block runs from the time of the run for `feature-days` days, with
    `feature-reason` (default "New release") and the product's `version`, and
    replaces the block carried forward. A run that names a feature entry, a
    key that is not in the map, or no key when the repo has more than one
    product that can be featured fails and writes nothing.
  schemas: |
    The site publishes its JSON Schema at
    `https://wyrd.foo/schemas/docs/v1.json`.

    - The Zod schemas in `src/schema/` are the single source of truth for
      `docs.yml`, page front matter and `tool.yaml`, and for the closed lists
      (kinds, statuses, categories, operating systems, install methods, MCP
      install methods). The module has no Astro imports and runs under plain
      Node; the site and the publisher import it.
    - The module also holds the cross-check (`crossCheck`): the checks in
      step 2 of `publisher` that read the `docs/user/` tree. The publisher
      checks each feature entry's `source` folder and the logo shape itself.
    - `/schemas/docs/v1.json` is generated from it at build time
      (`z.toJSONSchema`, Zod 4, draft 2020-12, input shape) by a static Astro
      endpoint, so the published schema and the site's own validation cannot
      drift. Page front matter is in the schema as `$defs.page`. The
      cross-checks are not in it.
    - The schema's `$id` is its URL.
    - The schema has one version, `1`. Every `docs.yml` declares
      `schemaVersion: 1`. The site and the publisher validate against that
      one schema and reject any other `schemaVersion`.
  permissions: |
    | Holder | Credential | Scope |
    | --- | --- | --- |
    | Publisher GitHub App `WYRD_TOOLS_DOCS_PUBLISHER` | Installation on wyrd.foo | Contents: read/write |
    | Tool repos | Org secrets `WYRD_TOOLS_DOCS_PUBLISHER_APP_ID`, `WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY` | Mint the App token inside the reusable workflow |
    | The tool repo's `GITHUB_TOKEN` | The calling workflow's token | Contents: read, to check out the repo and read its GitHub Releases |

    The reusable workflow mints the App token scoped to wyrd.foo, so the
    tool repo's own `GITHUB_TOKEN` needs no access to wyrd.foo. The App token
    push is a real actor, so it starts `cd.yml`.
