name: xolotl
version: 0.1.0
docs-version: 0.1.0
release-unit: xolotl
tagline: One proxy for your LLM subscriptions, AI gateways and MCP servers.
blurb: A self-hosted Rust proxy that gives coding agents one URL and one client key for Codex,
  Claude, Grok and OpenCode Go subscriptions, gateway providers and MCP servers, with every real
  credential kept in OpenBao.
status: preview
category: Agent Infrastructure
order: 7
kinds:
  - kind: app
    install:
      - method: docker
        default: true
        command: docker pull ghcr.io/wyrd-company/xolotl:latest
highlights:
  - One proxy for your LLM subscriptions, AI gateways and MCP servers.
media:
  - src: assets/demo.gif
    caption: An operator puts a policy, issues a client key into OpenBao, and the client lists the
      models its key can use
owner: wyrd-company/xolotl
