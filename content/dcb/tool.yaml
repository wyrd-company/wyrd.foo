name: dcb
version: 0.2.1
docs-version: 0.1.1
tagline: Build and run development containers from devcontainer.json.
blurb: A single Go binary that builds devcontainer images on Docker's built-in BuildKit and creates, starts, and runs lifecycle commands in development containers through the Docker Engine API. Commands write one JSON result line, except help, a valid exec and archive exports to stdout, so scripts and agents can read the outcome.
status: preview
category: Dev Containers
order: 9
kinds:
  - kind: cli
    install:
      - os:
          - macos
          - linux
        default: true
        command: brew install wyrd-company/tools/dcb
        method: homebrew
      - os:
          - macos
          - linux
        command: npm install --global @wyrd-company/dcb
        method: npm
      - os:
          - linux
        label: Debian, Ubuntu
        command: sudo apt install dcb
        method: apt
      - os:
          - linux
        label: Fedora, RHEL
        command: sudo dnf install dcb
        method: rpm
      - os:
          - linux
        command: paru -S dcb-bin
        method: aur
highlights:
  - Reads the same devcontainer.json as the Dev Container CLI and installs the same OCI features.
  - "One static binary: no Node.js and no docker command, only a reachable Docker Engine."
  - Builds on the daemon's built-in BuildKit, with each feature as a separate cached step.
  - Commands write one JSON result line, except help, a valid exec and archive exports to stdout, so scripts and agents read the outcome without parsing logs.
  - Creates containers that carry the upstream labels, so upstream tools and editors find them.
media:
  - src: assets/up-exec-down.png
    caption: Bring up a container, run a command in it and remove it.
    alt: Terminal output of dcb up and dcb down, each ending in a JSON result line, and of dcb exec, which prints the output of its command.
logo: assets/logo.svg
logo-dark: assets/logo-dark.svg
favicon: assets/favicon.svg
social-image: assets/social.png
release-unit: dcb
owner: wyrd-company/devcontainer-builder
docs-path: docs/user
release:
  version: 0.2.1
  date: 2026-11-01T22:08:17.000Z
  url: https://github.com/wyrd-company/devcontainer-builder/releases/tag/0.2.1
  notes: |
    
    ### Fixes

    - Honor Docker container names supplied through runArgs, including reuse and explicit recreation.
    - Honor read-only options in Docker mount object targets and reject non-spec mount object properties.
