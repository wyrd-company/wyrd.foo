name: dcb
version: 0.2.0
docs-version: 0.1.0
tagline: Build and run development containers from devcontainer.json.
blurb: A single Go binary that builds devcontainer images on Docker's built-in BuildKit and creates, starts, and runs lifecycle commands in development containers through the Docker Engine API. Commands write one JSON result line, except help, a valid exec and archive exports to stdout, so scripts and agents can read the outcome.
status: preview
category: Dev Containers
order: 9
kinds:
  - kind: cli
    install:
      - method: homebrew
        os:
          - macos
          - linux
        default: true
        command: brew install wyrd-company/tools/dcb
      - method: npm
        os:
          - macos
          - linux
        command: npm install --global @wyrd-company/dcb
      - method: apt
        os:
          - linux
        label: Debian, Ubuntu
        command: sudo apt install dcb
      - method: rpm
        os:
          - linux
        label: Fedora, RHEL
        command: sudo dnf install dcb
      - method: aur
        os:
          - linux
        command: paru -S dcb-bin
highlights:
  - Reads the same devcontainer.json as the Dev Container CLI and installs the same OCI features.
  - "One static binary: no Node.js and no docker command, only a reachable Docker Engine."
  - Builds on the daemon's built-in BuildKit, with each feature as a separate cached step.
  - Commands write one JSON result line, except help, a valid exec and archive exports to stdout, so scripts and agents read the outcome without parsing logs.
  - Creates containers that carry the upstream labels, so upstream tools and editors find them.
media:
  - src: assets/up-exec-down.png
    caption: Bring up a container, run a command in it and remove it.
    alt: Terminal output of dcb up and dcb down, each ending in a JSON result line, and of dcb exec, which prints the output of its command.
release-unit: dcb
owner: wyrd-company/devcontainer-builder
docs-path: docs/user
release:
  version: 0.2.0
  date: 2026-10-25T15:25:48.000Z
  url: https://github.com/wyrd-company/devcontainer-builder/releases/tag/0.2.0
  notes: |
    
    ### Features

    - Go library callers can supply one registry credential source for every registry request: `builder.Options.RegistryAuth` reaches BuildKit pulls and pushes, feature downloads and base image reads, and `dockercompose` forwards its sources to service builds. `registryauth.Static` holds caller credentials, and `registryauth.NewWithoutHelpers` reads the Docker client configuration without running credential helpers.

    ### Fixes

    - A feature's `containerEnv` is now expanded as the reference CLI's Dockerfile `ENV` expands it, in the reference CLI's key order (array-index keys such as `1` first, then the others as declared). A value such as the Go feature's `PATH=/usr/local/go/bin:/go/bin:${PATH}` keeps the base image's `PATH`, so the feature installs and the image keeps a working `PATH`. The generated Dockerfile writes these values the same way.
    - A credential source error that makes a build, a feature download or a base image read fail is now part of the returned error, so that `errors.Is` matches it.
