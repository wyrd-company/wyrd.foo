name: agent-svgtools
version: 0.1.0
docs-version: 0.1.0
release-unit: agent-svgtools
tagline: Close the loop for agents authoring SVG from images.
blurb: A machine-first Rust CLI that helps agents reconstruct raster artwork as maintainable SVG by
  inspecting structure, rendering candidates, scoring visual agreement, and localizing differences.
status: stable
category: Agent Tooling
order: 5
kinds:
  - kind: cli
    install:
      - method: homebrew
        os:
          - macos
          - linux
        default: true
        command: brew install wyrd-company/tools/agent-svgtools
      - method: cargo
        os:
          - macos
          - linux
          - windows
        label: Git
        command: cargo install --git https://github.com/wyrd-company/agent-svgtools.git
highlights:
  - Close the loop for agents authoring SVG from images.
media:
  - src: assets/demo.gif
    caption: Agent reconstructing an owl with agent-svgtools
owner: wyrd-company/agent-svgtools
