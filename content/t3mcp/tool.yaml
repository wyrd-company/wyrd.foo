name: t3mcp
version: 0.1.3
docs-version: 0.1.4
release-unit: t3code-mcp
tagline: Inspect and control T3 Code through complementary MCP tools.
blurb: A stdio MCP server for direct webhook addresses, delivery diagnostics, thread inspection, queue recovery, provider status and historical usage. Connect through the same saved profiles as t3c, beside the built-in T3 Code MCP server.
status: preview
category: Agent Tooling
kinds:
  - kind: mcp-server
    install:
      - method: claude-code
        default: true
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
      - method: claude-desktop
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
      - method: other
        label: Codex
        command: |-
          [mcp_servers.t3mcp]
          command = "npx"
          args = ["-y", "@wyrd-company/t3code-mcp", "--profile", "sample"]
      - method: cursor
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
      - method: other
        label: OpenCode
        command: |-
          {
            "mcp": {
              "t3mcp": {
                "type": "local",
                "command": [
                  "npx",
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ],
                "enabled": true
              }
            }
          }
      - method: other
        label: Pi
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
      - method: other
        label: Antigravity
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
      - method: json
        command: |-
          {
            "mcpServers": {
              "t3mcp": {
                "command": "npx",
                "args": [
                  "-y",
                  "@wyrd-company/t3code-mcp",
                  "--profile",
                  "sample"
                ]
              }
            }
          }
    tools:
      - name: scheduled_task_endpoint
        description: Read the direct webhook endpoint and optional Connect URL.
        effect: Read-only
      - name: scheduled_task_deliveries
        description: List webhook delivery outcomes and diagnostics.
        effect: Read-only
      - name: scheduled_task_delivery
        description: Read one webhook delivery and request details.
        effect: Read-only
      - name: rotate_scheduled_task_webhook
        description: Replace the webhook URL token.
        effect: Writes
      - name: scheduled_task_configuration
        description: Read full task configuration and run diagnostics.
        effect: Read-only
      - name: configure_scheduled_task
        description: Update execution selections for an existing task.
        effect: Writes
      - name: thread_status
        description: Read run, queue, request and background-work state.
        effect: Read-only
      - name: thread_approvals
        description: Read pending approvals for human review.
        effect: Read-only
      - name: thread_usage
        description: Read provider context, token and cost records.
        effect: Read-only
      - name: thread_diff
        description: Read a full-thread or checkpoint-range diff.
        effect: Read-only
      - name: thread_search_content
        description: Search within one thread.
        effect: Read-only
      - name: thread_family
        description: Read a thread's root, forks and subagent trees.
        effect: Read-only
      - name: worktree_threads
        description: List the active threads on a worktree path.
        effect: Read-only
      - name: tagged_threads
        description: List the threads that carry a tag.
        effect: Read-only
      - name: thread_terminals
        description: List the server terminals of a thread.
        effect: Read-only
      - name: terminal_output
        description: Read the recent output of one terminal.
        effect: Read-only
      - name: server_traces
        description: Summarize the server's trace files.
        effect: Read-only
      - name: server_processes
        description: List the server's backend descendant processes.
        effect: Read-only
      - name: server_host_resources
        description: Read CPU and memory of the server host.
        effect: Read-only
      - name: server_resource_history
        description: Read resource use of the server's processes over a window.
        effect: Read-only
      - name: server_storage_cleanup_report
        description: Read the latest storage cleanup report.
        effect: Read-only
      - name: local_servers
        description: List the local servers on the server host and their owners.
        effect: Read-only
      - name: stop_local_server
        description: Stop a local server that a thread's agent started.
        effect: Writes
      - name: thread_stop
        description: Stop thread work and hold queued messages.
        effect: Writes
      - name: thread_force_stop
        description: Force stop an agent that ignored Stop.
        effect: Writes
      - name: thread_tag
        description: Add or remove one tag on a thread.
        effect: Writes
      - name: thread_queue_resume
        description: Release held queued messages.
        effect: Writes
      - name: thread_queue_start
        description: Start a selected queued message and release the queue hold.
        effect: Writes
      - name: provider_status
        description: Read provider availability, authentication and limits.
        effect: Read-only
      - name: usage_summary
        description: Read historical usage buckets and source diagnostics.
        effect: Read-only
highlights:
  - Read direct webhook addresses without T3 Connect and diagnose deliveries.
  - Inspect thread state, approvals, usage, diffs and content matches.
  - Stop thread work, resume held queues or start a selected queued message.
  - Use saved t3c profiles and the server session’s existing permissions.
