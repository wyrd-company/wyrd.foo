name: wyrwood
version: 0.6.1
docs-version: 0.1.4
tagline: OpenBao-backed secrets and signing for containers, with nothing stored inside.
blurb: "A controller that owns policy and an agent on each Docker host that gives every bound container a directory of sockets: an OpenBao endpoint carrying the container's own token and an SSH agent whose keys live in OpenBao."
status: preview
category: Agent Infrastructure
order: 6
kinds:
  - kind: app
    install:
      - os:
          - linux
        command: sudo apt install wyrwood
        method: apt
      - os:
          - linux
        command: sudo dnf install wyrwood
        method: rpm
      - os:
          - linux
        command: paru -S wyrwood-bin
        method: aur
highlights:
  - A bound container holds no token, no key, and no secret file.
  - Each container gets a socket directory with vault.sock for the OpenBao API and ssh-agent.sock for SSH.
  - SSH identities are OpenBao Transit keys and SSH-engine certificates, and OpenBao produces every signature.
  - A policy pairs an OpenBao policy with a container contract, and changes apply on the next request.
  - Agents and scripts connect over SSH with keys that an operator approves in the web interface, and a script's key acts only inside its grant.
  - Operational events are bounded and categorical, with no tokens, secret values, or raw upstream errors.
