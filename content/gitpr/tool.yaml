name: gitpr
version: 0.1.0
docs-version: 0.1.0
release-unit: gitpr
tagline: Review worktree branches as local pull requests.
blurb: A local Go CLI and TUI that turns worktree branches into lightweight pull requests against
  your local default branch — no server, no remote, no forge.
status: stable
category: Git & Review
order: 1
kinds:
  - kind: cli
    install:
      - method: homebrew
        os:
          - macos
          - linux
        default: true
        command: brew install wyrd-company/tools/gitpr
highlights:
  - Review worktree branches as local pull requests.
media:
  - src: assets/demo.gif
    caption: gitpr local review demo
owner: wyrd-company/gitpr
