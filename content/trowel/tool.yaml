name: trowel
version: 0.1.0
docs-version: 0.1.0
release-unit: trowel
tagline: Relay webhooks into NATS JetStream, and JetStream messages back out.
blurb: A small Go service that verifies and transforms incoming webhooks, publishes them to
  JetStream with an acknowledgement, and delivers JetStream messages to HTTP endpoints or commands
  with retries, signing, and dead-lettering. Secrets can come from OpenBao or Vault over https or a
  unix socket.
status: preview
category: Agent Infrastructure
order: 8
kinds:
  - kind: app
    install:
      - method: apt
        os:
          - linux
        default: true
        command: sudo apt install trowel
      - method: rpm
        os:
          - linux
        command: sudo dnf install trowel
      - method: aur
        os:
          - linux
        command: paru -S trowel-bin
      - method: docker
        command: docker pull ghcr.io/wyrd-company/trowel:latest
highlights:
  - Relay webhooks into NATS JetStream, and JetStream messages back out.
media:
  - src: assets/demo.gif
    caption: A signed webhook is accepted, published to JetStream, and delivered to a command, while a
      forged one is rejected
owner: wyrd-company/trowel
