name: menagerie
version: 0.4.0
docs-version: 0.2.3
tagline: Manage workspaces and fleets of development containers through a web UI.
blurb: One container that creates workspaces from Toha templates through their interviews, provisions the Wyrwood binding and Xolotl key a template declares, shows every workspace with its devcontainer, starts, stops, rebuilds, upgrades and deletes them, and backs each one up to its own Git branch. Managers sign in through OpenID Connect; Wyrwood supplies its SSH key and registry credentials.
status: preview
category: Dev Containers
order: 10
kinds:
  - kind: app
    install:
      - default: true
        command: docker pull ghcr.io/wyrd-company/menagerie:0.4.0
        method: docker
highlights:
  - Creates a workspace from a Toha template through its interview in the browser. When the template declares what it needs and the host is prepared, the job issues its Xolotl key and makes its Wyrwood binding, so the container has its credentials on its first start, with no step in a CLI or another web interface.
  - Lists every workspace with the state of its devcontainer, starts, stops and rebuilds it as a job with a live console, and mints a T3 Code pairing token for a running workspace that has the t3code-server Feature.
  - Upgrades a workspace to a newer template version, asks only the new questions and keeps local edits.
  - "Deletes a workspace after you type its name: backs it up, then removes its binding, Xolotl key, containers and folder. Its backup branch stays."
  - Backs up each workspace to its own branch in one Git repository after each job that changes it, and can commit and back it up on a schedule.
  - Runs as one container with no database. Managers sign in through your OpenID Connect provider; Git private keys stay in OpenBao and signing uses Wyrwood.
