name: menagerie
version: 0.3.0
docs-version: 0.2.1
tagline: Manage workspaces and fleets of development containers through a web UI.
blurb: One container that creates workspaces from Toha templates through their interviews, shows every workspace with its devcontainer, starts, stops, rebuilds and upgrades them, and backs each one up to its own Git branch. Managers sign in through OpenID Connect; Wyrwood supplies its SSH key and registry credentials.
status: preview
category: Dev Containers
order: 10
kinds:
  - kind: app
    install:
      - method: docker
        default: true
        command: docker pull ghcr.io/wyrd-company/menagerie:0.3.0
highlights:
  - Creates a workspace from a Toha template by answering the template's interview in the browser.
  - Lists every workspace with the state of its devcontainer, and starts, stops and rebuilds it as a job with a live console.
  - Upgrades a workspace to a newer template version, asks only the new questions and keeps local edits.
  - Backs up each workspace to its own branch in one Git repository after every change.
  - Signs managers in through your OpenID Connect provider. Git private keys stay in OpenBao and signing uses Wyrwood. Installation tokens stay in memory; the generated interview signing key stays in the data volume.
  - Runs as one container with no database; the workspace files stay the source of truth.
