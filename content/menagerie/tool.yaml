release:
  version: 0.5.2
  date: 2026-11-27T05:27:33.000Z
  url: https://github.com/wyrd-company/menagerie/releases/tag/0.5.2
  notes: |
    ### Features

    - Each backup repository names its credential: a GitHub App from the new `github-apps` list, which names any number of Apps, or one of the SSH keys Wyrwood's agent offers. Its backups, moves and Apply branch fetches use that credential alone, so repositories in organizations with Apps of their own, or with deploy keys of their own, back up from one Menagerie. **Register repository** asks for the credential and shows the chosen key's public key to give the Git host, and **Change credential** changes it after a Validate with the new one passes. `GET /api/credentials` lists the Apps and keys, and `PUT /api/backup-repositories/{id}/credential` changes one. Repositories registered by an earlier release keep the credential their URL chooses until it is changed, and `github-app` keeps working as one App named `github-app`.
    - Each registered template names its credential too, chosen as a backup repository's is: a GitHub App that serves its `https` address, or one of the SSH keys Wyrwood's agent offers for an SSH address. Its checks, version checks, workspace creation and upgrades, and **Apply branch** fetch with that credential alone, and a refused fetch or a failed version check names it. **Register template** asks for the credential, **Validate** has a chosen App get a token for the repository, and **Change credential** changes it after a fetch with the new one passes, recording that fetch as the template's version check. `PUT /api/templates/{id}/credential` changes one. Templates registered by an earlier release, or imported from the `templates` key, keep the credential their URL chooses until it is changed.
