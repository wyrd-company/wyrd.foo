version: '3'

tasks:
  dev:
    desc: Start Astro development server
    cmds:
      - astro dev

  install:
    desc: Install dependencies
    cmds:
      - pnpm install

  build:
    desc: Build the site and its search index
    cmds:
      - pnpm build

  test:
    desc: Typecheck the docs contract, then run the schema and site tests
    cmds:
      - pnpm typecheck
      - pnpm test

  check:
    desc: Typecheck, run every test, build the site, then run the built-output checks
    cmds:
      - pnpm check
